name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      - name: Smoke-test check and doctor on the demo directory
        run: |
          node dist/cli.js check demo || true
          node dist/cli.js doctor demo
      - name: smoke golden fixture (expected drift)
        run: |
          set +e
          node dist/cli.js check test/fixtures/golden
          code=$?
          set -e
          test "$code" -eq 1
      - name: pack only ships dist README LICENSE .envcheckrc.example
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          ! grep -E 'test/fixtures|demo/\.env|node_modules' /tmp/pack.txt
